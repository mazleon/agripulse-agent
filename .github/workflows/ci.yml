name: CI

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"

jobs:
  # NOTE: Security checks run in parallel via .github/workflows/security-check.yml
  # Branch protection rules should require both CI + Security to pass before merge.

  # ── Backend ──────────────────────────────────────────────────────────────
  backend-lint:
    name: Backend Lint & Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.0"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: uv pip install -e ".[dev]"
      - name: Ruff lint
        run: uv run ruff check app/ tests/
      - name: Ruff format check
        run: uv run ruff format --check app/ tests/
      - name: MyPy
        run: uv run mypy app/

  backend-test:
    name: Backend Tests
    runs-on: ubuntu-latest
    needs: backend-lint
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agripulse
          POSTGRES_PASSWORD: agripulse
          POSTGRES_DB: agripulse_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: postgresql+asyncpg://agripulse:agripulse@localhost:5432/agripulse_test
      DATABASE_URL_SYNC: postgresql://agripulse:agripulse@localhost:5432/agripulse_test
      REDIS_URL: redis://localhost:6379/0
      QDRANT_URL: ""   # unit tests mock Qdrant; integration tests skip RAG
      QDRANT_API_KEY: ""
      QDRANT_COLLECTION_NAME: agripulse_rag_test
      APP_ENV: test
      SECRET_KEY: test-secret-key
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v3
        with:
          version: "0.5.0"
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install deps
        run: uv pip install -e ".[dev]"
      - name: Run migrations
        run: uv run alembic upgrade head
      - name: Check for unit tests
        id: check-unit
        run: |
          if [ -d tests/unit ] && [ "$(ls -A tests/unit/*.py 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Unit tests
        if: steps.check-unit.outputs.exists == 'true'
        run: uv run pytest tests/unit/ -v --cov=app --cov-report=term-missing
      - name: Check for integration tests
        id: check-integration
        run: |
          if [ -d tests/integration ] && [ "$(ls -A tests/integration/*.py 2>/dev/null | wc -l)" -gt 0 ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Integration tests
        if: steps.check-integration.outputs.exists == 'true'
        run: uv run pytest tests/integration/ -v

  # ── Frontend ─────────────────────────────────────────────────────────────
  frontend-lint:
    name: Frontend Lint & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - name: Check if frontend exists
        id: check
        run: |
          if [ -f package.json ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "No frontend code on this branch — skipping."
          fi
      - uses: actions/setup-node@v4
        if: steps.check.outputs.exists == 'true'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install deps
        if: steps.check.outputs.exists == 'true'
        run: npm ci
      - name: Lint
        if: steps.check.outputs.exists == 'true'
        run: npm run lint
      - name: Type check
        if: steps.check.outputs.exists == 'true'
        run: npm run type-check
      - name: Build
        if: steps.check.outputs.exists == 'true'
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000

  # ── Docker ───────────────────────────────────────────────────────────────
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-lint]
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -t agripulse-backend:ci backend/
      - name: Build frontend image
        run: |
          if [ -f frontend/Dockerfile ]; then
            docker build -t agripulse-frontend:ci frontend/
          else
            echo "No frontend Dockerfile — skipping."
          fi

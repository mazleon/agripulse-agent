name: Security Scan

on:
  push:
    branches: [main, dev, test]
  pull_request:
    branches: [main, dev, test]

jobs:
  # ── Secret Detection ───────────────────────────────────────────────────────
  trufflehog:
    name: TruffleHog Secret Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ── Prevent .env Files in Git ──────────────────────────────────────────────
  env-file-check:
    name: Env File Leak Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for committed .env files
        run: |
          echo "Scanning git history for .env files (excluding .env.example)..."
          COMMITTED=$(git log --all --pretty=format: --name-only --diff-filter=A | grep -E '\.env$' | grep -v '\.env\.example$' | sort -u || true)
          if [ -n "$COMMITTED" ]; then
            echo "FAIL: The following .env files were found in git history:"
            echo "$COMMITTED"
            exit 1
          fi
          echo "PASS: No .env files committed."

      - name: Check for hardcoded secrets in source
        run: |
          echo "Scanning source files for common secret patterns..."
          # Patterns: sk-or-, sk-ant-, sk-proj-, sb_publishable_, eyJhbGciOiJIUzI1Ni, postgres:// with password
          FOUND=0
          for pattern in 'sk-or-' 'sk-ant-' 'sk-proj-' 'sb_publishable_' 'eyJhbGciOiJIUzI1Ni' 'postgresql://.*:.*@' 'postgres://.*:.*@' 'api_key=[a-zA-Z0-9_-]\{20,\}' 'apikey=[a-zA-Z0-9_-]\{20,\}'; do
            MATCHES=$(grep -rn --include='*.py' --include='*.ts' --include='*.tsx' --include='*.js' --include='*.md' --include='*.yml' --include='*.yaml' -E "$pattern" . || true)
            if [ -n "$MATCHES" ]; then
              echo "WARNING: Potential secret pattern detected: $pattern"
              echo "$MATCHES" | head -20
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 1 ]; then
            echo ""
            echo "FAIL: Potential hardcoded secrets found in source files."
            echo "Move all secrets to environment variables or GitHub Secrets."
            exit 1
          fi
          echo "PASS: No hardcoded secrets detected in source files."

  # ── Dependency Vulnerability Scan ──────────────────────────────────────────
  dependency-check:
    name: Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scan Python dependencies
        uses: pypa/gh-action-pip-audit@v1.1.0
        with:
          inputs: backend/requirements*.txt backend/pyproject.toml

      - name: Scan Node dependencies
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: |
          cd frontend && npm audit --audit-level=high

  # ── Container Security ─────────────────────────────────────────────────────
  container-scan:
    name: Container Image Scan
    runs-on: ubuntu-latest
    needs: [trufflehog, env-file-check]
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -t agripulse-backend:security backend/

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: agripulse-backend:security
          format: sarif
          output: trivy-results.sarif

      - name: Upload Trivy scan results
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif

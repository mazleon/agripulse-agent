[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agripulse-backend"
version = "0.1.0"
description = "AgriPulse — Agentic chatbot for Bangladeshi farmers"
requires-python = ">=3.11"
dependencies = [
    # ── Web framework ──────────────────────────────────────────────────────
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.20",
    "websockets>=13.0",

    # ── LLM + Agents ──────────────────────────────────────────────────────
    "langgraph>=0.2.60",
    "langchain-core>=0.3.0",
    "langchain-openai>=0.3.33",
    "langchain-anthropic>=1.0.1",
    "langchain-google-genai>=2.0.7",
    "langchain-openrouter>=0.2.1",
    "anthropic>=0.40.0",

    # ── RAG ───────────────────────────────────────────────────────────────
    "llama-index-core>=0.12.0",
    "llama-index-vector-stores-postgres>=0.3.0",
    "llama-index-embeddings-fastembed>=0.3.0",
    "fastembed>=0.4.0",

    # ── Database ──────────────────────────────────────────────────────────
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pgvector>=0.3.6",

    # ── Config ────────────────────────────────────────────────────────────
    "pydantic-settings>=2.6.0",
    "pydantic>=2.10.0",

    # ── Memory ────────────────────────────────────────────────────────────
    "redis[hiredis]>=5.2.0",
    "graphiti-core>=0.3.0",

    # ── Auth ──────────────────────────────────────────────────────────────
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",

    # ── HTTP / Utils ──────────────────────────────────────────────────────
    "httpx>=0.28.0",
    "langdetect>=1.0.9",
    "pillow>=11.0.0",
    "python-dateutil>=2.9.0",

    # ── Observability ─────────────────────────────────────────────────────
    "sentry-sdk[fastapi]>=2.19.0",
    "langsmith>=0.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "httpx>=0.28.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "types-redis>=4.6.0",
    "types-passlib>=1.7.0",
    "types-python-dateutil>=2.9.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["alembic", "migrations"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN001", "ANN201"]
ignore = [
    "E501",     # line too long (handled by formatter)
    "B008",     # do not perform function calls in argument defaults (FastAPI pattern)
    "ANN001",   # missing type annotation for function argument
    "ANN201",   # missing return type annotation
]

[tool.ruff.lint.isort]
known-first-party = ["app"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
exclude = ["alembic/", "migrations/"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
]

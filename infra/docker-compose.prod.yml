version: "3.9"

# Production overrides — use with: docker compose -f docker-compose.yml -f docker-compose.prod.yml up

services:
  backend:
    restart: always
    volumes: []           # no live-mount in prod
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4
    environment:
      APP_ENV: production
      LOG_LEVEL: WARNING

  frontend:
    restart: always
    environment:
      NODE_ENV: production

  postgres:
    restart: always
    ports: []             # not exposed externally in prod

  redis:
    restart: always
    ports: []

  neo4j:
    restart: always
    ports: []
